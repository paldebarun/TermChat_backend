services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chat_user
      POSTGRES_PASSWORD: chat_password
      POSTGRES_DB: chat_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat_user -d chat_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # S3-compatible object store (replaces the archived MinIO image).
  # Credentials live in seaweedfs/s3.json and must match S3_ACCESS_KEY /
  # S3_SECRET_KEY in .env. -ip pins the raft node identity to the service name:
  # the default is the container IP, which changes on recreate and leaves the
  # persisted master state unable to elect a leader. -master.electionTimeout=1s
  # skips the default 10s leader wait on restart (single node, no peers).
  # Master/volume/filer ports are not published.
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: server -ip=seaweedfs -ip.bind=0.0.0.0 -master.electionTimeout=1s -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -s3.allowedOrigins=*
    volumes:
      - seaweedfs_data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      # 8333 must stay reachable by the browser (presigned upload URLs).
      - "8333:8333"
    healthcheck:
      # Any HTTP response from the S3 port (even 403) means it is up.
      test: ["CMD-SHELL", "wget -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/'"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Vector store for document search (app/assistant/vectorstore.py). The
  # assistant feature has no way to start without this - config.py
  # defaults CHROMA_HOST to this service name.
  chroma:
    image: chromadb/chroma:0.5.23
    restart: unless-stopped
    volumes:
      - chroma_data:/chroma/chroma
    # No published port: Chroma has no auth and holds plaintext document
    # chunks for every conversation. The app reaches it as chroma:8000 over
    # the compose network. For local debugging, temporarily add
    # "127.0.0.1:8001:8000".

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      chroma:
        condition: service_started
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  seaweedfs_data:
  chroma_data: